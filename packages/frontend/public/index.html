<!DOCTYPE html>
<html lang="en"> <head>
    <meta charset="utf-8" />
    <title>Product Management System</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Professional Product Management System" />
    <link rel="stylesheet" href="/../src/styles/index.css" />
    
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/favicon.ico" />
  </head>
  <body>
    <h1 class="sr-only">Product Management Application Dashboard</h1>
    <noscript>You need JavaScript to run this app.</noscript>

    <div id="root">
      <div class="loading" role="status" aria-live="polite">Loading Application...</div>
    </div>

    <div id="error-container" style="display: none" class="error" role="alert">
      An error occurred while loading the application.
    </div>

    <script>
      window.onerror = function (msg, url, lineNo) {
        const errDiv = document.getElementById('error-container');
        if (errDiv) errDiv.style.display = 'block';
        return false;
      };
    </script>
  </body>
</html>
